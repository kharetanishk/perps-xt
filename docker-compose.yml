services:
  postgres:
    image: postgres:16-alpine
    container_name: perps_xt
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: perp_user
      POSTGRES_PASSWORD: perp_pass
      POSTGRES_DB: perp_db
    volumes:
      - perps_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: perps_redis
    ports:
      - "6379:6379"

volumes:
  perps_postgres_data:
